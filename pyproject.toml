[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasyhelper"
version = "0.1.0"
description = "Local NBA fantasy draft assistant."
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]
